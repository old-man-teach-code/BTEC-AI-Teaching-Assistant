services:
  # Sử dụng external database và Redis từ Clever Cloud
  # Không cần local db và redis containers nữa

  api:
    build: .
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app